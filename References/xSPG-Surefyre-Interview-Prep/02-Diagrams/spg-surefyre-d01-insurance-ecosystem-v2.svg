ont-size="16" lengthAdjust="spacing" textLength="283.9531" x="55.5" y="250.5381">&#8226; Provides business and risk information</text><text fill="#202020" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="282.1797" x="55.5" y="268.9365">&#8226; Receives coverage, policy and service</text></g><!--entity AGENT--><g class="entity" data-qualified-name="AGENT" data-source-line="26" id="ent0002"><rect fill="#F2F7FF" height="203.1875" rx="7" ry="7" style="stroke:#5A5A5A;stroke-width:0.5;" width="257.2578" x="69" y="385.4365"/><text fill="#202020" font-family="Arial" font-size="16" font-weight="700" lengthAdjust="spacing" textLength="123.6016" x="97" y="428.4443">Retail Insurance</text><text fill="#202020" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="134.3047" x="97" y="446.8428">Agent / Broker&lt;/b&gt;</text><text fill="#202020" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="4.4453" x="97" y="465.2412">&#160;</text><text fill="#202020" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="134.5547" x="97" y="483.6396">&#8226; Advises the client</text><text fill="#202020" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="179.8828" x="97" y="502.0381">&#8226; Gathers risk information</text><text fill="#202020" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="186.1328" x="97" y="520.4365">&#8226; Prepares the submission</text><text fill="#202020" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="201.2578" x="97" y="538.835">&#8226; Presents quotes and terms</text><text fill="#202020" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="190.6016" x="97" y="557.2334">&#8226; Supports ongoing service</text></g><!--entity SPG--><g class="entity" data-qualified-name="SPG" data-source-line="28" id="ent0003"><rect fill="#FFF8E8" height="221.5859" rx="7" ry="7" style="stroke:#5A5A5A;stroke-width:0.5;" width="329.2813" x="33